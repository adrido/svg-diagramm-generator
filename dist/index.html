<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SVG-Diagramm-Generator</title>
    <meta property="og:type" content="website">
    <meta property="og:locale" content="de_DE">
    <meta property="og:title" content="SVG-Diagramm-Generator">
    <meta property="og:description" content="Gestalte dein Koordinatensystem mit vier unabhängig einstellbaren Achsenrichtungen und speichere es als SVG – direkt im Browser.">
    <meta property="og:url" content="https://adrido.github.io/svg-diagramm-generator/">
    <meta property="og:image" content="https://adrido.github.io/svg-diagramm-generator/social-preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SVG-Diagramm-Generator mit einem Beispiel für die Spannungs- und Stromachsen einer Diodenkennlinie.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#182232">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./icons/diagramm.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/diagramm-180.png">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./diagram.js"></script>
    <script defer src="./app.js"></script>
</head>

<body>
    <header>
        <div class="brand"><img class="logo" src="./icons/diagramm.svg" width="37" height="37"
                alt="">SVG-Diagramm-Generator</div>
        <nav aria-label="Datei">
            <details class="nav-menu" name="dateimenue">
                <summary><i data-i="plus"></i>Neu</summary>
                <div class="nav-items"><button data-template="0">+X / +Y</button><button data-template="1">−X /
                        −Y</button><button data-template="2">Vier Richtungen</button></div>
            </details>
            <details class="nav-menu" name="dateimenue">
                <summary><i data-i="folder"></i>SVG öffnen</summary>
                <div class="nav-items"><button id="open-local">Öffnen von lokaler Datei</button>
                    <button id="open-clipboard">Aus Zwischenablage öffnen</button>
                    <button data-template="3">Beispiel Diodenkennlinie</button></div>
            </details>
            <button id="save"><i data-i="save"></i>SVG speichern</button>
            <button id="copy">SVG kopieren</button>
            <label class="draft-option" title="Beim Ausschalten wird der lokale Entwurf gelöscht."><input
                    id="remember-draft" type="checkbox" role="switch" autocomplete="off">Entwurf auf diesem Gerät
                merken</label>
        </nav><input type="file" accept=".svg,image/svg+xml" hidden id="file">
    </header>
    <dialog id="clipboard-dialog" aria-labelledby="clipboard-heading">
        <h2 id="clipboard-heading"></h2>
        <label for="clipboard-source" id="clipboard-instruction"></label>
        <textarea id="clipboard-source" rows="6" spellcheck="false"></textarea>
        <p id="clipboard-error" role="status"></p>
        <div class="dialog-actions">
            <button id="clipboard-close">Schließen</button>
            <button id="clipboard-import">Öffnen</button>
        </div>
    </dialog>
    <main>
        <div class="intro">
            <div>
                <h1>Arbeitsbereich</h1>
                <p>Koordinatensystem konfigurieren und als SVG exportieren.</p>
            </div><span class="local"><i data-i="lock"></i>Lokal im Browser</span>
        </div>
        <div id="draft-message" role="status"></div>
        <div id="message" role="status"></div>
        <div class="workspace">
            <aside>
                <details class="general" open>
                    <summary>Allgemeine Einstellungen</summary>
                    <div class="fields">
                        <label class="full">Diagrammname / Titel<input id="diagram-title" maxlength="120"
                                aria-describedby="title-error"><small id="title-error" class="error"></small></label>
                        <label class="full">Maßeinheit<select id="size-unit">
                                <option value="px">Pixel (px)</option>
                                <option value="mm">Millimeter (mm)</option>
                            </select></label>
                        <label>Breite (<span id="width-unit">px</span>)<input id="width" inputmode="decimal"
                                aria-describedby="width-error"><small class="error" id="width-error"></small></label>
                        <label>Höhe (<span id="height-unit">px</span>)<input id="height" inputmode="decimal"
                                aria-describedby="height-error"><small class="error" id="height-error"></small></label>
                        <label class="full">Format der Einheitenbeschriftung
                            <select id="unit-format">
                                <option value="slash">Bruchstrich (DIN 461 / ISO 80000-1)</option>
                                <option value="in">Sprachlich „in“ (DIN 461)</option>
                                <option value="parentheses">Runde Klammern (international / NIST)</option>
                                <option value="brackets">Eckige Klammern (ältere Schreibweise)</option>
                            </select></label>
                        <label class="full check"><input type="checkbox" id="show-title">Titel im Diagramm
                            anzeigen</label>
                    </div>
                </details>
                <div class="panelhead"><i data-i="sliders"></i>
                    <h2>Achseneinstellungen</h2>
                </div>
                <div id="axes"></div>
            </aside>
            <section class="preview">
                <div class="panelhead"><i data-i="graph"></i>
                    <h2>Live-Vorschau</h2><span id="live">Aktuell</span>
                </div>
                <div class="stage">
                    <div id="sheet"></div>
                </div>
                <div class="options" id="options"></div>
                <div class="options"><label><input type="checkbox" id="minor-grid">Hilfsgitter</label>
                    <label>Unterteilungen pro Rasterfeld <select id="grid-divisions"></select></label>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
